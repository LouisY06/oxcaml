<head>
    <meta charset="UTF-8">

    <script type="module">
        // Log page load to detect reloads
        console.log('=== PAGE LOAD DETECTED ===');
        console.log('Timestamp:', new Date().toISOString());
        console.log('URL:', window.location.href);
        console.log('Referrer:', document.referrer);
        console.log('Performance navigation type:', performance.navigation.type);
        if (performance.navigation.type === 0) {
            console.log('Navigation type: TYPE_NAVIGATE (first load)');
        } else if (performance.navigation.type === 1) {
            console.log('Navigation type: TYPE_RELOAD (page reload)');
        } else if (performance.navigation.type === 2) {
            console.log('Navigation type: TYPE_BACK_FORWARD (back/forward)');
        }
        
        // Check for redirect result IMMEDIATELY, before Firebase initializes
        // This is critical - Firebase stores redirect state in URL parameters
        console.log('=== CHECKING URL FOR REDIRECT PARAMETERS ===');
        const urlParams = new URLSearchParams(window.location.search);
        const hasRedirectParams = urlParams.has('apiKey') || urlParams.has('mode') || urlParams.has('oobCode');
        console.log('URL search params:', window.location.search);
        console.log('Has redirect params:', hasRedirectParams);
        if (hasRedirectParams) {
            console.log('✅ REDIRECT DETECTED IN URL!');
            urlParams.forEach((value, key) => {
                console.log(`  ${key}: ${value.substring(0, 50)}...`);
            });
        } else {
            console.log('❌ No redirect parameters in URL');
        }
        
        // Import Firebase modules
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAXQmr5lp1EWizPZO727vH0SptNeGOWSSQ",
            authDomain: "ocml-e03d8.firebaseapp.com",
            projectId: "ocml-e03d8",
            storageBucket: "ocml-e03d8.firebasestorage.app",
            messagingSenderId: "1046269959504",
            appId: "1:1046269959504:web:ce2802f92f482c0f572055"
        };
        
        console.log('=== INITIALIZING FIREBASE ===');
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        console.log('Firebase initialized, auth object:', auth);
        console.log('Auth current user (before redirect check):', auth.currentUser);
        
        // Make Firebase available globally for OCaml bindings
        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        
        // ============================================================
        // FIREBASE AUTH WRAPPER FUNCTIONS FOR OCAML
        // ============================================================
        window.firebaseSignIn = async function(email, password) {
            try {
                console.log('firebaseSignIn called with email:', email);
                const { signInWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                console.log('Sign in successful! User:', userCredential.user.uid);
                return { success: true, user: userCredential.user };
            } catch (error) {
                console.error('Sign in error:', error.message);
                return { success: false, error: error.message };
            }
        };
        
        window.firebaseCreateUser = async function(email, password) {
            try {
                console.log('firebaseCreateUser called with email:', email);
                const { createUserWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                console.log('Sign up successful! User:', userCredential.user.uid);
                return { success: true, user: userCredential.user };
            } catch (error) {
                console.error('Sign up error:', error.message);
                return { success: false, error: error.message };
            }
        };
        
        window.firebaseSignOut = async function() {
            try {
                const { signOut } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
                await signOut(auth);
                return { success: true };
            } catch (error) {
                return { success: false, error: error.message };
            }
        };
        
        window.firebaseSignInWithGoogle = async function() {
            try {
                console.log('=== firebaseSignInWithGoogle called ===');
                const { signInWithRedirect, getRedirectResult, GoogleAuthProvider } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
                const provider = new GoogleAuthProvider();
                console.log('GoogleAuthProvider created, initiating redirect...');
                console.log('Current URL before redirect:', window.location.href);
                // Use redirect instead of popup to avoid COOP policy issues
                await signInWithRedirect(auth, provider);
                console.log('signInWithRedirect called - page should redirect now');
                // Note: The redirect will navigate away, so we return a pending state
                // The actual result will be handled by getRedirectResult when the page loads back
                return { success: true, pending: true };
            } catch (error) {
                console.error('firebaseSignInWithGoogle error:', error);
                return { success: false, error: error.message };
            }
        };
        
        // Handle redirect result when page loads
        window.firebaseGetRedirectResult = async function() {
            try {
                const { getRedirectResult } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
                const result = await getRedirectResult(auth);
                if (result && result.user) {
                    return { success: true, user: result.user };
                } else {
                    return { success: false, error: "No redirect result" };
                }
            } catch (error) {
                return { success: false, error: error.message };
            }
        };
        
        window.setFirebaseAuthCallback = function(callback) {
            console.log('Setting up Firebase auth callback...');
            console.log('Current URL when setting up callback:', window.location.href);
            console.log('Auth current user:', auth.currentUser);
            
            // Import onAuthStateChanged from Firebase auth module
            import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js').then(async ({ onAuthStateChanged, getRedirectResult }) => {
                console.log('Firebase auth module imported, setting up listener');
                
                // Check for redirect result FIRST and WAIT for it to complete
                // This must be done before setting up onAuthStateChanged to avoid timing issues
                console.log('=== Checking for redirect result... ===');
                console.log('Calling getRedirectResult with auth:', auth);
                try {
                    const result = await getRedirectResult(auth);  // Use await to wait for completion
                    console.log('=== getRedirectResult completed ===');
                    console.log('Result object:', result);
                    console.log('Result type:', typeof result);
                    console.log('Result is null?', result === null);
                    console.log('Result is undefined?', result === undefined);
                    if (result) {
                        console.log('Result.user:', result.user);
                        console.log('Result.operationType:', result.operationType);
                        console.log('Result.providerId:', result.providerId);
                    }
                    
                    if (result && result.user) {
                        console.log('✅ Google redirect sign-in successful!');
                        console.log('User email:', result.user.email);
                        console.log('User UID:', result.user.uid);
                        console.log('NOW CALLING CALLBACK WITH USER...');
                        
                        // CRITICAL: Call the callback with the signed-in user
                        callback(result.user);
                        
                        console.log('Callback called successfully');
                    } else {
                        console.log('ℹ️ No redirect result - user probably did not use Google sign-in');
                        console.log('This is normal if:');
                        console.log('  - User just loaded the page (no redirect)');
                        console.log('  - User used email/password sign-in');
                        console.log('  - Redirect already processed');
                    }
                } catch (error) {
                    console.log('❌ Redirect result error:', error);
                    console.log('Error code:', error.code);
                    console.log('Error message:', error.message);
                    console.log('Error stack:', error.stack);
                }
                
                // THEN set up the ongoing auth state listener
                // This fires for future auth state changes
                console.log('Now setting up onAuthStateChanged listener...');
                const unsubscribe = onAuthStateChanged(auth, (user) => {
                    console.log('Auth state changed, user:', user ? user.email : 'signed out');
                    console.log('Calling auth callback with user:', user ? 'authenticated' : 'null');
                    // Call the callback immediately
                    callback(user);
                    // Also check current user to ensure state is synced
                    if (user) {
                        console.log('User is authenticated, email:', user.email, 'uid:', user.uid);
                    } else {
                        console.log('User is signed out');
                    }
                });
                
                // Return unsubscribe function (though OCaml doesn't use it)
                return unsubscribe;
            }).catch((error) => {
                console.error('Error setting up auth callback:', error);
                // If import fails, the app should still work, just without auth
            });
        };
        
        // ============================================================
        // FIRESTORE WRAPPER FUNCTIONS FOR OCAML
        // ============================================================
        window.firebaseSetDoc = async function(collectionPath, docId, data) {
            try {
                const { doc, setDoc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const docRef = doc(db, collectionPath, docId);
                await setDoc(docRef, data);
                return { success: true };
            } catch (error) {
                return { success: false, error: error.message };
            }
        };
        
        window.firebaseGetDoc = async function(collectionPath, docId) {
            try {
                const { doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const docRef = doc(db, collectionPath, docId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    return { success: true, data: docSnap.data() };
                } else {
                    return { success: true, data: null };
                }
            } catch (error) {
                return { success: false, error: error.message };
            }
        };
        
        window.firebaseOnSnapshot = async function(collectionPath, docId, callback) {
            try {
                const { doc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const docRef = doc(db, collectionPath, docId);
                return onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        callback(docSnap.data());
                    } else {
                        callback(null);
                    }
                });
            } catch (error) {
                console.error('Firebase onSnapshot error:', error);
                return null;
            }
        };
        
        window.firebaseQueryCollection = async function(collectionPath, field, op, value) {
            try {
                const { collection, query, where, getDocs } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const collRef = collection(db, collectionPath);
                let q = query(collRef);
                if (field && op && value !== undefined) {
                    q = query(collRef, where(field, op, value));
                }
                const querySnapshot = await getDocs(q);
                const docs = [];
                querySnapshot.forEach((doc) => {
                    docs.push({ id: doc.id, data: doc.data() });
                });
                return { success: true, docs: docs };
            } catch (error) {
                return { success: false, error: error.message };
            }
        };
        
        window.firebaseDeleteDoc = async function(collectionPath, docId) {
            try {
                const { doc, deleteDoc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const docRef = doc(db, collectionPath, docId);
                await deleteDoc(docRef);
                return { success: true };
            } catch (error) {
                return { success: false, error: error.message };
            }
        };
        
        console.log('Firebase initialized');
        // Signal that Firebase is ready
        window.firebaseReady = true;
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script>

        // Only clear the specific game state key, not all localStorage
        // Firebase uses localStorage/sessionStorage to store redirect results
        console.log('=== Clearing saved game state (preserving Firebase state) ===');
        try {
            // Only remove the game state, not all localStorage
            localStorage.removeItem('speed_game_state');
            console.log('Game state cleared from localStorage');

                console.error('ERROR: Saved game still exists after removal!');
            } else {
                console.log('Verified: No saved game in localStorage');

        } catch (e) {
            console.error('ERROR: Could not clear saved game:', e);
        }
        
        // DEBUG: Log all storage to see what Firebase is storing
        console.log('=== DEBUGGING STORAGE ===');
        console.log('Current URL:', window.location.href);
        console.log('Origin:', window.location.origin);
        console.log('Path:', window.location.pathname);
        
        // Check Local Storage
        console.log('=== LOCAL STORAGE ===');

                console.log('Local Storage keys:', localStorageKeys);

                    const value = localStorage.getItem(key);
                    console.log(`  ${key}:`, value ? (value.length > 100 ? value.substring(0, 100) + '...' : value) : 'null');
                });
            } else {
                console.log('Local Storage is EMPTY');
            }
        } catch (e) {
            console.error('Error reading Local Storage:', e);
        }
        
        // Check Session Storage
        console.log('=== SESSION STORAGE ===');

            console.log('Session Storage keys count:', sessionStorageKeys.length);
            if (sessionStorageKeys.length > 0) {
                console.log('Session Storage keys:', sessionStorageKeys);
                sessionStorageKeys.forEach(key => {
                    const value = sessionStorage.getItem(key);
                    console.log(`  ${key}:`, value ? (value.length > 100 ? value.substring(0, 100) + '...' : value) : 'null');

            } else {
                console.log('Session Storage is EMPTY');

        } catch (e) {
            console.error('Error reading Session Storage:', e);
        }
        
        // Check IndexedDB
        console.log('=== INDEXEDDB ===');
        if ('indexedDB' in window) {
            indexedDB.databases().then(databases => {
                console.log('IndexedDB databases count:', databases.length);
                if (databases.length > 0) {
                    databases.forEach(db => {
                        console.log(`  Database: ${db.name}, version: ${db.version}`);
                    });
                } else {
                    console.log('No IndexedDB databases found');
                }
            }).catch(e => {
                console.error('Error reading IndexedDB:', e);
            });
        } else {
            console.log('IndexedDB not supported');
        }
        
        // NOTE: Service worker unregistration removed - it was interfering with Firebase redirects
        // Service workers are needed for Firebase's redirect flow to work properly
    </script>

        console.log('Service Worker registration DISABLED for debugging Firebase redirects');
        
        // Also unregister any existing service workers on every page load
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    console.log('Unregistering existing service worker:', registration.scope);
                    registration.unregister().then(function(success) {
                        if (success) {
                            console.log('✅ Service worker unregistered successfully');
                        } else {
                            console.log('❌ Failed to unregister service worker');
                        }
                    });
                }
            });
        }
        
        // ============================================================
        // ONLINE/OFFLINE STATUS MONITORING
        // ============================================================
        // Monitor network connectivity and update UI indicator
        // This helps users know if they're using cached content
        
        // Event fires when browser detects internet connection restored
        window.addEventListener('online', () => {
            console.log('Back online!');
            const statusEl = document.getElementById('offline-status');
            if (statusEl) {
                statusEl.textContent = 'Online';
                statusEl.style.color = 'green';
            }
        });
        
        // Event fires when browser detects internet connection lost
        window.addEventListener('offline', () => {
            console.log('Gone offline - using cached version');
            const statusEl = document.getElementById('offline-status');
            if (statusEl) {
                statusEl.textContent = 'Offline';
                statusEl.style.color = 'orange';
            }
        });
        
        // Check initial connection status on page load
        // navigator.onLine may not be 100% accurate but gives a good indication
        if (!navigator.onLine) {
            const statusEl = document.getElementById('offline-status');
            if (statusEl) {
                statusEl.textContent = 'Offline';
                statusEl.style.color = 'orange';
            }
        }
        
        // ============================================================
        // LOCAL STORAGE HELPER - Save Indicator
        // ============================================================
        // This function is called from OCaml code when game state is saved
        // It shows a visual indicator to the user that their progress was saved
        window.showSaveIndicator = function() {
            const indicator = document.getElementById('save-indicator');
            if (indicator) {
                // Add 'show' class to make indicator visible
                indicator.classList.add('show');
                // Remove 'show' class after 1.5 seconds (fade out)
                setTimeout(() => {
                    indicator.classList.remove('show');
                }, 1500);
            }
        };
        
        // ============================================================
        // LOCAL STORAGE CHECK - Already cleared above, just log
        // ============================================================
        window.addEventListener('load', () => {
            try {
                const saved = localStorage.getItem('speed_game_state');
                if (saved) {
                    console.error('ERROR: Saved game found AFTER clearing! Removing again...');
                    localStorage.removeItem('speed_game_state');
                } else {
                    console.log('Verified: No saved game in localStorage on load');
                }
            } catch (e) {
                console.log('Could not check saved game:', e);
            }
        });
        
        // Bonsai handles the game loop in OCaml using Clock.every
        // AI updates every 2 seconds automatically!
        console.log('Speed Card Game - AI plays continuously via Bonsai Clock!');
        console.log('Offline support enabled via Service Worker');
    </script>
