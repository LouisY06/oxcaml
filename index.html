    <script type="module">
        // Log page load to detect reloads
        console.log('=== PAGE LOAD DETECTED ===');
        console.log('Timestamp:', new Date().toISOString());
        console.log('URL:', window.location.href);
        console.log('Referrer:', document.referrer);
        console.log('Performance navigation type:', performance.navigation.type);

        } else if (performance.navigation.type === 1) {
            console.log('Navigation type: TYPE_RELOAD (page reload)');
        } else if (performance.navigation.type === 2) {
            console.log('Navigation type: TYPE_BACK_FORWARD (back/forward)');
        }
        
        // Check for redirect result IMMEDIATELY, before Firebase initializes
        // This is critical - Firebase stores redirect state in URL parameters
        console.log('=== CHECKING URL FOR REDIRECT PARAMETERS ===');
        const urlParams = new URLSearchParams(window.location.search);
        const hasRedirectParams = urlParams.has('apiKey') || urlParams.has('mode') || urlParams.has('oobCode');
        console.log('URL search params:', window.location.search);
        console.log('Has redirect params:', hasRedirectParams);
        if (hasRedirectParams) {
            console.log('✅ REDIRECT DETECTED IN URL!');
            urlParams.forEach((value, key) => {
                console.log(`  ${key}: ${value.substring(0, 50)}...`);

        // Import Firebase modules
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAXQmr5lp1EWizPZO727vH0SptNeGOWSSQ",
            authDomain: "ocml-e03d8.firebaseapp.com",
            projectId: "ocml-e03d8",
            storageBucket: "ocml-e03d8.firebasestorage.app",
            messagingSenderId: "1046269959504",
            appId: "1:1046269959504:web:ce2802f92f482c0f572055"
        };
        
        console.log('=== INITIALIZING FIREBASE ===');
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        console.log('Firebase initialized, auth object:', auth);
        console.log('Auth current user (before redirect check):', auth.currentUser);
        
        // Make Firebase available globally for OCaml bindings
        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        
        // ============================================================
        // FIREBASE AUTH WRAPPER FUNCTIONS FOR OCAML
        // ============================================================
        // Helper function to convert Firebase error codes to user-friendly messages
        function getFriendlyErrorMessage(error) {
            const errorCode = error.code || '';
            const errorMessage = error.message || '';
            
            // Extract the error code from messages like "Firebase: Error (auth/invalid-credential)"
            let code = errorCode;
            if (!code && errorMessage.includes('auth/')) {
                const match = errorMessage.match(/auth\/([a-z-]+)/i);
                if (match) code = 'auth/' + match[1];
            }
            
            // Map Firebase error codes to user-friendly messages
            const errorMessages = {
                'auth/invalid-credential': 'Invalid email or password. Please check your credentials and try again.',
                'auth/user-not-found': 'No account found with this email address.',
                'auth/wrong-password': 'Incorrect password. Please try again.',
                'auth/email-already-in-use': 'This email is already registered. Please sign in instead.',
                'auth/weak-password': 'Password is too weak. Please use at least 6 characters.',
                'auth/invalid-email': 'Invalid email address. Please check your email format.',
                'auth/too-many-requests': 'Too many failed attempts. Please wait a few minutes and try again.',
                'auth/network-request-failed': 'Network error. Please check your internet connection.',
                'auth/user-disabled': 'This account has been disabled. Please contact support.',
                'auth/operation-not-allowed': 'This sign-in method is not enabled. Please contact support.',
                'auth/requires-recent-login': 'Please sign out and sign in again to complete this action.'
            };
            
            // Return user-friendly message if available, otherwise return the original message
            if (code && errorMessages[code]) {
                return errorMessages[code];
            }
            
            // If no mapping found, try to extract a readable message from Firebase error
            if (errorMessage.includes('auth/')) {
                return 'Authentication error. Please check your credentials and try again.';
            }
            
            return errorMessage || 'An unexpected error occurred. Please try again.';
        }
        
        window.firebaseSignIn = async function(email, password) {
            try {
                console.log('firebaseSignIn called with email:', email);
                const { signInWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                console.log('Sign in successful! User:', userCredential.user.uid);
                return { success: true, user: userCredential.user };
            } catch (error) {
                console.error('Sign in error:', error);
                console.error('Error code:', error.code);
                console.error('Error message:', error.message);
                const friendlyMessage = getFriendlyErrorMessage(error);
                console.error('User-friendly error:', friendlyMessage);
                return { success: false, error: friendlyMessage };
            }
        };
        
        window.firebaseCreateUser = async function(email, password) {
            try {
                console.log('=== firebaseCreateUser called ===');
                console.log('Email:', email);
                console.log('Password length:', password ? password.length : 0);
                const { createUserWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
                console.log('Calling createUserWithEmailAndPassword...');
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                console.log('✅ Sign up successful! User UID:', userCredential.user.uid);
                console.log('User email:', userCredential.user.email);
                return { success: true, user: userCredential.user };
            } catch (error) {
                console.error('❌ Sign up error:', error);
                console.error('Error code:', error.code);
                console.error('Error message:', error.message);
                console.error('Full error object:', JSON.stringify(error, null, 2));
                const friendlyMessage = getFriendlyErrorMessage(error);
                console.error('User-friendly error:', friendlyMessage);
                return { success: false, error: friendlyMessage };
            }
        };
        
        window.firebaseSignOut = async function() {
            try {
                const { signOut } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
                await signOut(auth);
                return { success: true };
            } catch (error) {
                return { success: false, error: error.message };
            }
        };
        
        window.firebaseSignInWithGoogle = async function() {
            try {
                console.log('=== firebaseSignInWithGoogle called ===');
                console.log('Auth object:', auth);
                console.log('Auth app:', auth?.app);
                
                // Check if Google sign-in is enabled
                if (!auth) {
                    console.error('❌ Auth object is null!');
                    return { success: false, error: 'Firebase Auth is not initialized. Please check your Firebase configuration.' };
                }
                
                const { signInWithRedirect, GoogleAuthProvider } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
                console.log('Firebase auth module imported successfully');
                
                const provider = new GoogleAuthProvider();
                console.log('GoogleAuthProvider created:', provider);
                
                // Add scopes if needed
                provider.addScope('email');
                provider.addScope('profile');
                
                console.log('Current URL before redirect:', window.location.href);
                console.log('About to call signInWithRedirect...');
                
                // Use redirect instead of popup to avoid COOP policy issues
                await signInWithRedirect(auth, provider);
                
                // If we reach here, the redirect didn't happen (shouldn't happen)
                console.warn('⚠️ signInWithRedirect returned without redirecting - this is unexpected');
                return { success: true, pending: true };
            } catch (error) {
                console.error('❌ firebaseSignInWithGoogle error:', error);
                console.error('Error code:', error.code);
                console.error('Error message:', error.message);
                console.error('Full error:', JSON.stringify(error, null, 2));
                
                // Provide user-friendly error messages
                let errorMessage = error.message || 'Unknown error';
                if (error.code === 'auth/operation-not-allowed') {
                    errorMessage = 'Google sign-in is not enabled in Firebase Console. Please enable it in Authentication > Sign-in method > Google.';
                } else if (error.code === 'auth/popup-blocked') {
                    errorMessage = 'Popup was blocked. Please allow popups for this site.';
                } else if (error.code === 'auth/redirect-cancelled-by-user') {
                    errorMessage = 'Sign-in was cancelled.';
                } else if (error.code) {
                    errorMessage = `Google sign-in failed: ${error.code}. ${error.message}`;
                }
                
                return { success: false, error: errorMessage };
            }
        };
        
        // Handle redirect result when page loads
        window.firebaseGetRedirectResult = async function() {
            try {
                const { getRedirectResult } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
                const result = await getRedirectResult(auth);
                if (result && result.user) {
                    return { success: true, user: result.user };
                } else {
                    return { success: false, error: "No redirect result" };
                }
            } catch (error) {
                return { success: false, error: error.message };
            }
        };
        
        window.setFirebaseAuthCallback = function(callback) {
            console.log('Setting up Firebase auth callback...');
            console.log('Current URL when setting up callback:', window.location.href);
            console.log('Auth current user:', auth.currentUser);
            
            // Import onAuthStateChanged from Firebase auth module
            import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js').then(async ({ onAuthStateChanged, getRedirectResult }) => {
                console.log('Firebase auth module imported, setting up listener');
                
                // CRITICAL: Check auth.currentUser FIRST before calling getRedirectResult
                // getRedirectResult consumes the redirect state, so if currentUser already exists,
                // we should use that instead
                console.log('=== Checking auth.currentUser BEFORE getRedirectResult ===');
                console.log('Auth currentUser:', auth.currentUser);
                
                // Check if we're coming back from a redirect by looking at URL params or sessionStorage
                const urlParams = new URLSearchParams(window.location.search);
                const hasRedirectParams = urlParams.has('__firebase_request_key') || 
                                         sessionStorage.getItem('firebase:pendingRedirect:' + auth.app.options.apiKey + ':[DEFAULT]');
                console.log('Has redirect indicators:', hasRedirectParams);
                
                if (auth.currentUser) {
                    console.log('✅ auth.currentUser already exists!');
                    console.log('User email:', auth.currentUser.email);
                    console.log('User UID:', auth.currentUser.uid);
                    console.log('This means user is already signed in - calling callback immediately');
                    // Use setTimeout to ensure Bonsai is ready
                    setTimeout(() => {
                        callback(auth.currentUser);
                        console.log('Callback called with existing currentUser (delayed)');
                    }, 100);
                } else {
                    console.log('No currentUser - checking for redirect result...');
                    
                    // Check sessionStorage for Firebase redirect state
                    console.log('=== Checking sessionStorage for Firebase redirect state ===');
                    const sessionKeys = Object.keys(sessionStorage);
                    const firebaseRedirectKeys = sessionKeys.filter(key => key.includes('firebase') && key.includes('pendingRedirect'));
                    console.log('Firebase redirect keys in sessionStorage:', firebaseRedirectKeys);
                    firebaseRedirectKeys.forEach(key => {
                        const value = sessionStorage.getItem(key);
                        console.log(`  ${key}: ${value}`);
                    });
                    
                    // Check for redirect result
                    console.log('=== Calling getRedirectResult ===');
                    try {
                        const result = await getRedirectResult(auth);  // Use await to wait for completion
                        console.log('=== getRedirectResult completed ===');
                        console.log('Result object:', result);
                        console.log('Result is null?', result === null);
                        console.log('Auth currentUser after getRedirectResult:', auth.currentUser);
                        
                        if (result && result.user) {
                            console.log('✅ Google redirect sign-in successful from getRedirectResult!');
                            console.log('User email:', result.user.email);
                            console.log('User UID:', result.user.uid);
                            console.log('NOW CALLING CALLBACK WITH USER...');
                            
                            // CRITICAL: Call the callback with the signed-in user
                            // Use setTimeout to ensure Bonsai component is ready
                            setTimeout(() => {
                                callback(result.user);
                                console.log('Callback called successfully (delayed for Bonsai)');
                            }, 100);
                        } else if (auth.currentUser) {
                            // If getRedirectResult returns null but auth.currentUser now exists,
                            // the redirect was processed but getRedirectResult didn't return it
                            console.log('⚠️ getRedirectResult returned null BUT auth.currentUser now exists!');
                            console.log('Current user email:', auth.currentUser.email);
                            console.log('Current user UID:', auth.currentUser.uid);
                            console.log('Redirect was processed - calling callback with currentUser');
                            // Use setTimeout to ensure Bonsai component is ready
                            setTimeout(() => {
                                callback(auth.currentUser);
                                console.log('Callback called with currentUser (delayed for Bonsai)');
                            }, 100);
                        } else {
                            console.log('ℹ️ No redirect result and no currentUser');
                            console.log('This is normal if:');
                            console.log('  - User just loaded the page (no redirect)');
                            console.log('  - User used email/password sign-in');
                        }
                    } catch (error) {
                        console.log('❌ Redirect result error:', error);
                        console.log('Error code:', error.code);
                        console.log('Error message:', error.message);
                        
                        // Even if getRedirectResult fails, check if currentUser exists
                        if (auth.currentUser) {
                            console.log('⚠️ Error but auth.currentUser exists - using currentUser');
                            callback(auth.currentUser);
                        }
                    }
                }
                
                // THEN set up the ongoing auth state listener
                // This fires for future auth state changes
                console.log('Now setting up onAuthStateChanged listener...');
                const unsubscribe = onAuthStateChanged(auth, (user) => {
                    console.log('Auth state changed, user:', user ? user.email : 'signed out');
                    console.log('Calling auth callback with user:', user ? 'authenticated' : 'null');
                    // Call the callback immediately
                    callback(user);
                    // Also check current user to ensure state is synced
                    if (user) {
                        console.log('User is authenticated, email:', user.email, 'uid:', user.uid);
                    } else {
                        console.log('User is signed out');
                    }
                });
                
                // Return unsubscribe function (though OCaml doesn't use it)
                return unsubscribe;
            }).catch((error) => {
                console.error('Error setting up auth callback:', error);
                // If import fails, the app should still work, just without auth
            });
        };
        
        // ============================================================
        // FIRESTORE WRAPPER FUNCTIONS FOR OCAML
        // ============================================================
        window.firebaseSetDoc = async function(collectionPath, docId, data, merge = false) {
            try {
                console.log(`=== firebaseSetDoc called: ${collectionPath}/${docId} ===`);
                console.log('Data:', data);
                console.log('Merge:', merge);
                const { doc, setDoc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const docRef = doc(db, collectionPath, docId);
                if (merge) {
                    await setDoc(docRef, data, { merge: true });
                    console.log(`✅ firebaseSetDoc with merge success: ${collectionPath}/${docId}`);
                } else {
                    await setDoc(docRef, data);
                    console.log(`✅ firebaseSetDoc success: ${collectionPath}/${docId}`);
                }
                return { success: true };
            } catch (error) {
                console.error(`❌ firebaseSetDoc error: ${collectionPath}/${docId}`, error);
                console.error('Error code:', error.code);
                console.error('Error message:', error.message);
                return { success: false, error: error.message };
            }
        };
        
        window.firebaseGetDoc = async function(collectionPath, docId) {
            try {
                const { doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const docRef = doc(db, collectionPath, docId);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    return { success: true, data: docSnap.data() };
                } else {
                    return { success: true, data: null };
                }
            } catch (error) {
                return { success: false, error: error.message };
            }
        };
        
        window.firebaseOnSnapshot = async function(collectionPath, docId, callback) {
            try {
                const { doc, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const docRef = doc(db, collectionPath, docId);
                return onSnapshot(docRef, 
                    (docSnap) => {
                        // Success callback
                        try {
                            if (docSnap.exists()) {
                                const data = docSnap.data();
                                if (data) {
                                    callback(data);
                                } else {
                                    console.warn('onSnapshot: docSnap.data() returned null/undefined');
                                    callback(null);
                                }
                            } else {
                                callback(null);
                            }
                        } catch (err) {
                            console.error('onSnapshot callback error:', err);
                            callback(null);
                        }
                    },
                    (error) => {
                        // Error callback (permission denied, etc.)
                        console.error('Firestore onSnapshot error:', error);
                        callback(null);
                    }
                );
            } catch (error) {
                console.error('Firebase onSnapshot setup error:', error);
                callback(null);
            }
        };
        
        window.firebaseQueryCollection = async function(collectionPath, field, op, value) {
            try {
                console.log(`=== firebaseQueryCollection called: ${collectionPath} where ${field} ${op} ${value} ===`);
                const { collection, query, where, getDocs } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const collRef = collection(db, collectionPath);
                let q = query(collRef);
                if (field && op && value !== undefined) {
                    q = query(collRef, where(field, op, value));
                }
                const querySnapshot = await getDocs(q);
                console.log(`✅ Query returned ${querySnapshot.size} documents`);
                const docs = [];
                querySnapshot.forEach((doc) => {
                    docs.push({ id: doc.id, data: doc.data() });
                });
                console.log(`✅ Returning ${docs.length} documents to OCaml`);
                return { success: true, docs: docs };
            } catch (error) {
                console.error(`❌ firebaseQueryCollection error: ${collectionPath}`, error);
                console.error('Error code:', error.code);
                console.error('Error message:', error.message);
                console.error('Full error:', JSON.stringify(error, null, 2));
                return { success: false, error: error.message };
            }
        };
        
        window.firebaseDeleteDoc = async function(collectionPath, docId) {
            try {
                const { doc, deleteDoc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const docRef = doc(db, collectionPath, docId);
                await deleteDoc(docRef);
                return { success: true };
            } catch (error) {
                return { success: false, error: error.message };
            }
        };
        
        console.log('Firebase initialized');
        // Signal that Firebase is ready
        window.firebaseReady = true;
        window.dispatchEvent(new Event('firebase-ready'));
    </script>

    <script>
        // CRITICAL: Clear saved game state (but preserve Firebase's redirect state)
        // Only clear the specific game state key, not all localStorage
        // Firebase uses localStorage/sessionStorage to store redirect results
        console.log('=== Clearing saved game state (preserving Firebase state) ===');
        try {
            // Only remove the game state, not all localStorage
            localStorage.removeItem('speed_game_state');
            console.log('Game state cleared from localStorage');
            // Verify it's gone
            if (localStorage.getItem('speed_game_state')) {
                console.error('ERROR: Saved game still exists after removal!');
            } else {
                console.log('Verified: No saved game in localStorage');
            }
        } catch (e) {
            console.error('ERROR: Could not clear saved game:', e);
        }
        
        // DEBUG: Log all storage to see what Firebase is storing
        console.log('=== DEBUGGING STORAGE ===');
        console.log('Current URL:', window.location.href);
        console.log('Origin:', window.location.origin);
        console.log('Path:', window.location.pathname);
        
        // Check Local Storage
        console.log('=== LOCAL STORAGE ===');
        try {
            const localStorageKeys = Object.keys(localStorage);
            console.log('Local Storage keys count:', localStorageKeys.length);
            if (localStorageKeys.length > 0) {
                console.log('Local Storage keys:', localStorageKeys);
                localStorageKeys.forEach(key => {
                    const value = localStorage.getItem(key);
                    console.log(`  ${key}:`, value ? (value.length > 100 ? value.substring(0, 100) + '...' : value) : 'null');
                });
            } else {
                console.log('Local Storage is EMPTY');
            }
        } catch (e) {
            console.error('Error reading Local Storage:', e);
        }
        
        // Check Session Storage
        console.log('=== SESSION STORAGE ===');
        try {
            const sessionStorageKeys = Object.keys(sessionStorage);
            console.log('Session Storage keys count:', sessionStorageKeys.length);
            if (sessionStorageKeys.length > 0) {
                console.log('Session Storage keys:', sessionStorageKeys);
                sessionStorageKeys.forEach(key => {
                    const value = sessionStorage.getItem(key);
                    console.log(`  ${key}:`, value ? (value.length > 100 ? value.substring(0, 100) + '...' : value) : 'null');
                });
            } else {
                console.log('Session Storage is EMPTY');
            }
        } catch (e) {
            console.error('Error reading Session Storage:', e);
        }
        
        // Check IndexedDB
        console.log('=== INDEXEDDB ===');
        if ('indexedDB' in window) {
            indexedDB.databases().then(databases => {
                console.log('IndexedDB databases count:', databases.length);
                if (databases.length > 0) {
                    databases.forEach(db => {
                        console.log(`  Database: ${db.name}, version: ${db.version}`);
                    });
                } else {
                    console.log('No IndexedDB databases found');
                }
            }).catch(e => {
                console.error('Error reading IndexedDB:', e);
            });
        } else {
            console.log('IndexedDB not supported');
        }
        
        // NOTE: Service worker unregistration removed - it was interfering with Firebase redirects
        // Service workers are needed for Firebase's redirect flow to work properly
    </script>

    <!-- Include the compiled Bonsai JavaScript -->
    <script>
        const APP_VERSION = 'v3-2024-12-11-fixed';
        console.log('========================================');
        console.log('APP VERSION:', APP_VERSION);
        console.log('Timestamp:', new Date().toISOString());
        console.log('========================================');
        console.log('About to load OCaml app...');
        // Stub out threading functions to prevent errors (js_of_ocaml doesn't support threads)
        if (typeof jsoo_runtime !== 'undefined' && jsoo_runtime) {
            if (!jsoo_runtime.caml_thread_initialize) {
                jsoo_runtime.caml_thread_initialize = function() { return 0; };
            }
        }
        // Also stub on global runtime object if it exists
        if (typeof runtime !== 'undefined' && runtime) {
            if (!runtime.caml_thread_initialize) {
                runtime.caml_thread_initialize = function() { return 0; };
            }
        }
        window.addEventListener('error', (e) => {
            // Ignore threading errors - they're harmless
            if (e.message && e.message.includes('caml_thread_initialize')) {
                console.log('Threading error suppressed (expected in js_of_ocaml)');
